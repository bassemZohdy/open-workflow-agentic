document:
  dsl: '1.0.3'
  namespace: agentic
  name: checkpoint-recovery-test
  version: '1.0.0'
  title: Retained actual checkpoint receipt repair
  summary: Two actual event checkpoints leave retained receipts for bounded ACK repair before a restored task advances.
input:
  schema:
    format: json
    document:
      type: object
do:
  - awaitFirst:
      listen:
        to:
          one:
            with:
              type: org.openworkflow.agentic.repair.test
      timeout:
        after: PT60S
  - awaitSecond:
      listen:
        to:
          one:
            with:
              type: org.openworkflow.agentic.repair.test
      timeout:
        after: PT60S
  - continueAfterRepair:
      set:
        repaired: true
