document:
  dsl: '1.0.3'
  namespace: agentic
  name: human-checkpoint-test
  version: '1.0.0'
do:
  - awaitDecision:
      listen:
        to:
          one:
            with:
              type: io.openworkflow.human.decision.v1
              source: 'urn:openworkflow:human-decision'
      timeout:
        after: PT30S
  - afterDecision:
      set:
        continued: true
