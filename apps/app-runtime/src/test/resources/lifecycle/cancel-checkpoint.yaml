document:
  dsl: '1.0.3'
  namespace: agentic
  name: cancel-checkpoint-test
  version: '1.0.0'
  title: Cancellation checkpoint ordering
  summary: A delayed wait checkpoint must stay held after cancellation removes execution state.
input:
  schema:
    format: json
    document:
      type: object
do:
  - awaitDecision:
      listen:
        to:
          one:
            with:
              type: org.openworkflow.agentic.atomic.test
      timeout:
        after: PT30S
  - performEffect:
      set:
        effect: true
