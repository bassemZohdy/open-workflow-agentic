# --- Database (single Postgres for workflow state, agent checkpoints and scheduler) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/agentic}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
# Finite pooled-connection admission; SQL/network/whole-operation deadlines are separate.
quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:5S}

# --- Structured CloudEvents inbox (WP-107) ---
# With no deployment-approved producer entries, every receive is denied.
agentic.events.retention=PT24H
agentic.events.policy-folder=policy/events
# Example only: bind a verified producer to exact tenant, source, type, definition and wait occurrence.
# agentic.events.producers.orders.tenant=tenant-1
# agentic.events.producers.orders.kind=SERVICE
# agentic.events.producers.orders.subject=issuer-service-account-subject
# agentic.events.producers.orders.source=urn:example:orders
# agentic.events.producers.orders.types=com.example.order.ready
# agentic.events.producers.orders.definitions=agentic/order-process
# agentic.events.producers.orders.correlations=approval-1
# The caller also needs oa.events.receive and an ALLOW from the dedicated event PEP.
quarkus.hibernate-orm.database.generation=update

# --- Quarkus Flow: OWS workflow definitions are loaded from src/main/resources/flow ---
quarkus.flow.definitions.dir=flow
# Workflow input schemas use the SDK validator; InputSchemaRuntimeTest checks actual enforcement.

# --- Model access (Quarkus LangChain4j). Override for a real provider or gateway. ---
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:not-set}
quarkus.langchain4j.openai.base-url=${LLM_BASE_URL:https://api.openai.com/v1/}
quarkus.langchain4j.openai.chat-model.model-name=${LLM_MODEL:gpt-4o-mini}
quarkus.langchain4j.timeout=60s

# --- Agent defaults ---
agentic.agent.checkpoint-schema=public

# --- Effect tracing (WP-108/WP-112) ---
# SDK is disabled by default. A deployment enables it at runtime and selects an approved OTLP collector.
# Custom effect schema v1 records only fixed operation/outcome names, never keys, payloads or credentials.
quarkus.otel.service.name=open-workflow-agentic-runtime
quarkus.otel.traces.exporter=cdi
quarkus.otel.sdk.disabled=true
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=0.1
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false
quarkus.otel.bsp.max.queue.size=512
quarkus.otel.bsp.max.export.batch.size=128
quarkus.otel.bsp.export.timeout=2S
# Automatic HTTP/database tracing needs its own privacy review and stays disabled.
quarkus.otel.instrument.rest=false
quarkus.otel.instrument.resteasy-client=false
quarkus.otel.instrument.vertx-http=false
quarkus.otel.instrument.vertx-event-bus=false
quarkus.datasource.jdbc.telemetry=false
# Adding the OTel extension must not enable model prompt/completion or tool-content capture.
quarkus.langchain4j.tracing.include-prompt=false
quarkus.langchain4j.tracing.include-completion=false
quarkus.langchain4j.tracing.include-tool-arguments=false
quarkus.langchain4j.tracing.include-tool-result=false

# --- Caller identity (WP-102, docs/identity.md) ---
# A caller is a verified bearer token. With no issuer configured, every token is refused (401/503), so no endpoint is
# open by accident. Configure all three together:
#   agentic.identity.issuer=https://sso.example/realms/agentic
#   agentic.identity.jwks-uri=https://sso.example/realms/agentic/protocol/openid-connect/certs
#   agentic.identity.audience=oa-api
# Development seam: X-Tenant, X-Subject and X-Scopes are read (for requests without a bearer token) only when this flag
# is true AND the active profile is one of header-seam-profiles. The production profile never allows it: the application
# refuses to start. Never enable in a deployment.
agentic.dev.trust-caller-headers=false
agentic.dev.header-seam-profiles=dev,test
# Sweep that marks expired delegation grants (the record only: an expired grant is unusable from its expiry).
agentic.identity.expiry-sweep-cron=0 */5 * * * ?
# Token exchange (RFC 8693) for agents. Without a token endpoint every exchange is refused. The client secret is a file
# in agentic.secrets.dir, never an environment variable (it rotates):
#   agentic.identity.token-endpoint=https://sso.example/realms/agentic/protocol/openid-connect/token
#   agentic.identity.exchange.client-id=oa-agent-runtime
#   agentic.identity.exchange.client-secret-name=exchange-client-secret
#   agentic.secrets.dir=/var/run/secrets/agentic
#   agentic.secrets.ttl=PT30S        (unchanged file re-read at least this often; a changed file is noticed at once)
#   agentic.secrets.max-stale=PT2M   (cached value usable this long after ttl while the file cannot be read)

# --- Schema + scheduler ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.db-scheduler.table-name=scheduled_tasks

# --- Retries (ADR 0019 Retries, ADR 0023 decision 3; WP-003 Q08) ---
# The Flow HTTP client retries failed calls three times by default, below the OWS retry policy, so a non-idempotent
# call can run more than once. The only retry is the OWS retry policy of a definition, used only for calls whose
# effect is in the effect ledger (WP-108).
quarkus.flow.http.client.resilience.retry.max-retries=0

# --- Lifecycle reconciler (WP-105c, docs/lifecycle.md, section Reconciler) ---
agentic.reconciler.enabled=true
agentic.reconciler.interval=PT30S
agentic.reconciler.warmup-timeout=PT120S
agentic.reconciler.start-stale-after=PT60S
agentic.reconciler.start-max-attempts=3
agentic.reconciler.start-backoff=PT5S
agentic.reconciler.cancel-reissue-after=PT30S
agentic.reconciler.wait-deadline=PT24H
agentic.reconciler.batch-size=100
# Boot tests share one database with tests that create rows on purpose (EngineFailureTest expects a STARTING row);
# they run the reconciler by calling reconcileOnce() on their own instance, not in the background.
%test.agentic.reconciler.enabled=false

# --- Dev-only switches (WP-105c). Never enable any of these in a deployment. ---
# agentic.dev.lifecycle-probes exposes /dev/lifecycle/* for process tests (effect probe, event injection).
agentic.dev.lifecycle-probes=false
%test.agentic.dev.lifecycle-probes=true
# agentic.dev.fault.crash-at makes the process halt (kill -9 equivalent) at one point: after-insert, after-prepare or
# before-accept. Unset by default.

# Boot tests use a random port, so parallel Maven runs on one host do not collide on 8081.
%test.quarkus.http.test-port=0

# --- Audit trail (WP-111, M15) ---
# Development only: lets /audit answer without a bound policy decision point. Off by default, which answers 403.
agentic.dev.audit-open=${AUDIT_DEV_OPEN:false}
# Salt for redacted fields. Required when a rule redacts. Set it per deployment from a secret, never in the repository.
agentic.audit.redaction-salt=${AUDIT_REDACTION_SALT:}
# Verification of every chain, as a db-scheduler job (hourly, at 17 minutes past).
agentic.audit.verify-cron=0 17 * * * ?


# Required Flow checkpoint writes fail closed. Timeout or write failure holds execution,
# makes readiness DOWN and refuses new starts until restore in a healthy process.
# Cancellation writes can still be attempted. Positive duration, maximum PT5M.
agentic.persistence.commit-timeout=PT30S
