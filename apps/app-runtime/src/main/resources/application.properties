# --- Database (single Postgres for workflow state, agent checkpoints and scheduler) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/agentic}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=update

# --- Quarkus Flow: OWS workflow definitions are loaded from src/main/resources/flow ---
quarkus.flow.definitions.dir=flow
# Enforce declared OWS input schemas before a workflow instance starts.
quarkus.flow.validation.input.enabled=true

# --- Model access (Quarkus LangChain4j). Override for a real provider or gateway. ---
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:not-set}
quarkus.langchain4j.openai.base-url=${LLM_BASE_URL:https://api.openai.com/v1/}
quarkus.langchain4j.openai.chat-model.model-name=${LLM_MODEL:gpt-4o-mini}
quarkus.langchain4j.timeout=60s

# --- Agent defaults ---
agentic.agent.checkpoint-schema=public

# --- Caller identity (WP-102 replaces it). Headers X-Tenant and X-Subject are trusted only when this is true. ---
# Default false: every instance endpoint answers 401 until authentication exists. Never enable in a deployment.
agentic.dev.trust-caller-headers=false

# --- Schema + scheduler ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.db-scheduler.table-name=scheduled_tasks

# --- Retries (ADR 0019 Retries, ADR 0023 decision 3; WP-003 Q08) ---
# The Flow HTTP client retries failed calls three times by default, below the OWS retry policy, so a non-idempotent
# call can run more than once. The only retry is the OWS retry policy of a definition, used only for calls whose
# effect is in the effect ledger (WP-108).
quarkus.flow.http.client.resilience.retry.max-retries=0

# --- Lifecycle reconciler (WP-105c, docs/lifecycle.md, section Reconciler) ---
agentic.reconciler.enabled=true
agentic.reconciler.interval=PT30S
agentic.reconciler.warmup-timeout=PT120S
agentic.reconciler.start-stale-after=PT60S
agentic.reconciler.start-max-attempts=3
agentic.reconciler.start-backoff=PT5S
agentic.reconciler.cancel-reissue-after=PT30S
agentic.reconciler.wait-deadline=PT24H
agentic.reconciler.batch-size=100
# Boot tests share one database with tests that create rows on purpose (EngineFailureTest expects a STARTING row);
# they run the reconciler by calling reconcileOnce() on their own instance, not in the background.
%test.agentic.reconciler.enabled=false

# --- Dev-only switches (WP-105c). Never enable any of these in a deployment. ---
# agentic.dev.lifecycle-probes exposes /dev/lifecycle/* for process tests (effect probe, event injection).
agentic.dev.lifecycle-probes=false
%test.agentic.dev.lifecycle-probes=true
# agentic.dev.fault.crash-at makes the process halt (kill -9 equivalent) at one point: after-insert, after-prepare or
# before-accept. Unset by default.

# Boot tests use a random port, so parallel Maven runs on one host do not collide on 8081.
%test.quarkus.http.test-port=0

# --- Audit trail (WP-111, M15) ---
# Development only: lets /audit answer without a bound policy decision point. Off by default, which answers 403.
agentic.dev.audit-open=${AUDIT_DEV_OPEN:false}
# Salt for redacted fields. Required when a rule redacts. Set it per deployment from a secret, never in the repository.
agentic.audit.redaction-salt=${AUDIT_REDACTION_SALT:}
# Verification of every chain, as a db-scheduler job (hourly, at 17 minutes past).
agentic.audit.verify-cron=0 17 * * * ?
