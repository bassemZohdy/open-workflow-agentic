document:
  dsl: '1.0.3'
  namespace: portability
  name: branch
  version: '1.0.0'
do:
- choose:
    switch:
    - first:
        when: ${ .kind == "first" }
        then: selected
    - default:
        then: fallback
- selected:
    do:
    - compose:
        set:
          result: selected
    then: end
- fallback:
    set:
      result: fallback
