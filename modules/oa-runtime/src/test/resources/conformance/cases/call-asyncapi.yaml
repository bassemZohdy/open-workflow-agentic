document:
  dsl: '1.0.3'
  namespace: portability
  name: call-asyncapi
  version: '1.0.0'
do:
- invoke:
    call: asyncapi
    with:
      document:
        endpoint: https://example.invalid/asyncapi.yaml
      operation: publishItem
      message:
        payload:
          id: ${ .id }
    timeout:
      after:
        seconds: 1
