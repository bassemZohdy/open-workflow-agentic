# WP-003 spike configuration. Own database spike_a; never the agentic database.
# Port 18094 is fixed because the YAML definitions call back into this application on that port.
quarkus.http.port=18094
# @QuarkusTest defaults to 8081, which other sessions on this host use. Keep the same port as above.
quarkus.http.test-port=18094

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SPIKE_DB_URL:jdbc:postgresql://localhost:5432/spike_a}
quarkus.datasource.username=${SPIKE_DB_USER:postgres}
quarkus.datasource.password=${SPIKE_DB_PASSWORD:postgres}

# Q06: Flow JPA tables come from Hibernate entities (no Flyway scripts ship in quarkus-flow-jpa).
# Overridden per run by the Q06 process test.
quarkus.hibernate-orm.database.generation=${SPIKE_HIBERNATE_GENERATION:update}

quarkus.flyway.migrate-at-start=true

quarkus.flow.definitions.dir=flow
# Q02/Q11: restore persisted instances at startup (the default). Stated explicitly for the record.
quarkus.flow.persistence.auto-restore=true

# Q08: Quarkus Flow's HTTP client retries failed calls 3 times by default (below the OWS retry policy).
# In-process tests switch the client-level retry off so the OWS try/retry policy is what gets observed.
# ProcessRestartTest.Q08_defaultClientRetryRepeatsPostBelowOwsPolicy runs the packaged app with the default.
%test.quarkus.flow.http.client.resilience.retry.max-retries=0
# In-process tests start from an empty database so leftover instances cannot interfere.
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.hibernate-orm.database.generation=drop-and-create
