# Q08: a non-idempotent POST that fails twice with HTTP 500. Shows whether a retry repeats the effect.
document:
  dsl: '1.0.0'
  namespace: spike
  name: spike-flaky-post
  version: '1.0.0'
do:
  - postWithRetry:
      try:
        - postCall:
            call: http
            with:
              method: post
              endpoint:
                uri: http://localhost:18094/spike/flaky-post/p1
              body: ${ . }
      catch:
        retry:
          delay:
            milliseconds: 100
          limit:
            attempt:
              count: 3
  - probeAfter:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18094/spike/probe/flaky-post-after
        body: ${ . }
