# Q11: a task with an external side effect that takes time. The endpoint records a row first,
# then sleeps, so a kill -9 lands while the task is in flight.
document:
  dsl: '1.0.0'
  namespace: spike
  name: spike-effect
  version: '1.0.0'
do:
  - sendEffect:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18094/spike/effect
        body: ${ . }
  - probeAfter:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18094/spike/probe/effect-after
        body: ${ . }
