# Q02, Q04, Q05, Q11: probe, wait for an event, probe again.
document:
  dsl: '1.0.0'
  namespace: spike
  name: spike-listen
  version: '1.0.0'
do:
  - probeBefore:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18094/spike/probe/before
        body: ${ . }
  - waitForGo:
      listen:
        to:
          one:
            with:
              type: spike.go
  - probeAfter:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18094/spike/probe/after
        body: ${ . }
