# Q08: a call that fails twice, then succeeds. Retry policy: three attempts, short delay.
document:
  dsl: '1.0.0'
  namespace: spike
  name: spike-retry
  version: '1.0.0'
do:
  - flakyWithRetry:
      try:
        - flakyCall:
            call: http
            with:
              method: get
              endpoint:
                uri: http://localhost:18094/spike/flaky/r1
      catch:
        retry:
          delay:
            milliseconds: 100
          limit:
            attempt:
              count: 3
  - probeAfter:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18094/spike/probe/retry-after
        body: ${ . }
