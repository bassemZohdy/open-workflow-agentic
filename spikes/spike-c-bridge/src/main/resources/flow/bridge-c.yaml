# Bridge C: asynchronous start. The task starts the agent run and returns at once (202).
# The agent signals back with callback CloudEvents. The agent keeps each callback in an outbox and redelivers it
# until the workflow acknowledges it (POST /agents/research/acks), so a callback that arrives before the listen is
# registered is not lost (WP-005 Q5). The approval is a separate CloudEvent.
# The JSON event model is the whole CloudEvent, so payload fields are read under .data (WP-005 finding).
document:
  dsl: '1.0.0'
  namespace: spikec
  name: bridge-c
  version: '1.0.0'
  summary: WP-005 bridge C. Asynchronous start, callbacks with an outbox and acknowledgement.
do:
  - startAgent:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18196/agents/research/start
        headers:
          X-Correlation-Id: ${ $workflow.input.correlationId }
        body: ${ $workflow.input }
  - awaitAgentStarted:
      listen:
        to:
          one:
            with:
              type: spikec.agent.started
            correlate:
              instanceId:
                from: ${ .data.instanceId }
                expect: ${ $workflow.input.instanceId }
  - ackStarted:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18196/agents/research/acks
        body: '${ { instanceId: ((if type == "array" then .[0] else . end) | (.instanceId // .data.instanceId)), type: "spikec.agent.started" } }'
  - awaitApproval:
      listen:
        to:
          one:
            with:
              type: spikec.approval.v1
            correlate:
              instanceId:
                from: ${ .data.instanceId }
                expect: ${ $workflow.input.instanceId }
  - resumeAgent:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18196/agents/research/resume-async
        body: '${ { instanceId: ((if type == "array" then .[0] else . end) | (.instanceId // .data.instanceId)) } }'
  - awaitAgentCompleted:
      listen:
        to:
          one:
            with:
              type: spikec.agent.completed
            correlate:
              instanceId:
                from: ${ .data.instanceId }
                expect: ${ $workflow.input.instanceId }
  - ackCompleted:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18196/agents/research/acks
        body: '${ { instanceId: ((if type == "array" then .[0] else . end) | (.instanceId // .data.instanceId)), type: "spikec.agent.completed" } }'
