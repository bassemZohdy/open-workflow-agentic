# Bridge A: the workflow calls the agent over HTTP, in the same application (WP-005).
# The run task returns when the agent reaches its approval interrupt; the approval is a CloudEvent;
# the resume task calls the agent again. Context travels in the request body and in X-Correlation-Id.
document:
  dsl: '1.0.0'
  namespace: spikec
  name: bridge-a
  version: '1.0.0'
  summary: WP-005 bridge A. HTTP call to the agent in the same application.
do:
  - runAgent:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18195/agents/research/run
        headers:
          X-Correlation-Id: ${ $workflow.input.correlationId }
        body: ${ $workflow.input }
  - awaitApproval:
      listen:
        to:
          one:
            with:
              type: spikec.approval.v1
            # The JSON event model is the whole CloudEvent, so the payload field is under .data (WP-005 finding).
            correlate:
              instanceId:
                from: ${ .data.instanceId }
                expect: ${ $workflow.input.instanceId }
  - resumeAgent:
      call: http
      with:
        method: post
        endpoint:
          uri: http://localhost:18195/agents/research/resume
        body: '${ { instanceId: ((if type == "array" then .[0] else . end) | (.instanceId // .data.instanceId)) } }'
