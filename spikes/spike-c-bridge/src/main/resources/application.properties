# WP-005 spike configuration. Own database spike_c; never agentic, spike_a or spike_b.
# Port 18196 is fixed because the YAML definitions call back into this application on that port.
# 8081 and 18195 are used by other sessions on this host and are not used here. SPIKEC_JDBC_URL overrides the database (tests and runs).
quarkus.http.port=18196

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SPIKEC_JDBC_URL:jdbc:postgresql://localhost:5432/spike_c}
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# Flow JPA tables are created from the Hibernate entities (WP-003 Q06). This spike owns schema spikec itself.
quarkus.hibernate-orm.database.generation=update

quarkus.flow.definitions.dir=flow
# Engine logs at DEBUG for the spike (event matching and task outcomes).
quarkus.log.category."io.serverlessworkflow".level=DEBUG
quarkus.log.category."io.quarkiverse.flow".level=DEBUG
quarkus.flow.persistence.auto-restore=true
# Same as WP-003: the Flow HTTP client retries 3 times by default, below the OWS retry policy. Off for this spike.
quarkus.flow.http.client.resilience.retry.max-retries=0

# oa-runtime is used only for its LlmClient port and the scripted double. Its agent beans are not part of this spike.
quarkus.arc.exclude-types=io.github.bassemzohdy.openworkflow.agentic.runtime.agent.ResearchAgent,\
  io.github.bassemzohdy.openworkflow.agentic.runtime.agent.LangChain4jLlmClient,\
  io.github.bassemzohdy.openworkflow.agentic.runtime.api.AgentResource,\
  io.github.bassemzohdy.openworkflow.agentic.runtime.api.correlation.CorrelationIdFilter,\
  io.github.bassemzohdy.openworkflow.agentic.runtime.api.problem.ProblemDetailMapper
