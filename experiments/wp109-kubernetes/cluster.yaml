apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow
  namespace: owa-wp109
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-leases
  namespace: owa-wp109
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-leases
  namespace: owa-wp109
subjects:
- kind: ServiceAccount
  name: workflow
  namespace: owa-wp109
roleRef:
  kind: Role
  name: workflow-leases
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow
  namespace: owa-wp109
spec:
  replicas: 2
  selector:
    matchLabels: { app: workflow }
  template:
    metadata:
      labels: { app: workflow }
    spec:
      serviceAccountName: workflow
      containers:
      - name: app
        image: owa-wp109-kube-experiment:local
        imagePullPolicy: Never
        ports: [{ containerPort: 8080 }]
        env:
        - { name: DB_URL, value: 'jdbc:postgresql://db:5432/agentic' }
        - { name: DB_USER, value: postgres }
        - { name: DB_PASSWORD, value: localtest }
        - { name: QUARKUS_PROFILE, value: itest }
        - { name: AGENTIC_DEV_TRUST_CALLER_HEADERS, value: 'true' }
        - { name: AGENTIC_DEV_HEADER_SEAM_PROFILES, value: itest }
        - { name: AGENTIC_DEV_LIFECYCLE_PROBES, value: 'true' }
        - { name: AGENTIC_RECONCILER_MULTI_REPLICA, value: 'true' }
        - { name: AGENTIC_RECONCILER_INTERVAL, value: PT2S }
        - { name: AGENTIC_OUTBOX_RELAY_ENABLED, value: 'false' }
        - { name: QUARKUS_FLOW_DURABLE_KUBE_POOL_NAME, value: wp109 }
        - { name: QUARKUS_FLOW_DURABLE_KUBE_LEASE_MEMBER_DURATION, value: '10' }
        - { name: QUARKUS_FLOW_DURABLE_KUBE_LEASE_LEADER_DURATION, value: '10' }
        - { name: QUARKUS_FLOW_DURABLE_KUBE_LEASE_MEMBER_ACQUIRE_TIMEOUT, value: 90s }
        - { name: QUARKUS_FLOW_DURABLE_KUBE_SCHEDULERS_MEMBER_INTERVAL, value: 2s }
        - { name: QUARKUS_FLOW_DURABLE_KUBE_SCHEDULERS_LEADER_INTERVAL, value: 2s }
        - { name: QUARKUS_FLOW_DURABLE_KUBE_SCHEDULERS_MEMBER_INITIAL_DELAY, value: '1' }
        - { name: QUARKUS_FLOW_DURABLE_KUBE_SCHEDULERS_LEADER_INITIAL_DELAY, value: '1' }
        readinessProbe:
          httpGet: { path: /q/health/ready, port: 8080 }
          initialDelaySeconds: 3
          periodSeconds: 3
