name: ows-conformance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ows-conformance.yml'
      - 'pom.xml'
      - 'modules/oa-runtime/pom.xml'
      - 'modules/oa-runtime/src/test/**/conformance/**'
      - 'apps/app-runtime/src/main/resources/flow/**'
      - 'docs/conformance/**'
  push:
    branches: [main, 'gpt/**', 'claude/**']
    paths:
      - '.github/workflows/ows-conformance.yml'
      - 'pom.xml'
      - 'modules/oa-runtime/pom.xml'
      - 'modules/oa-runtime/src/test/**/conformance/**'
      - 'apps/app-runtime/src/main/resources/flow/**'
      - 'docs/conformance/**'
permissions:
  contents: read
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Run affected module tests and verify the recorded assessment and controls
        run: mvn -B -pl modules/oa-runtime -am test
      - name: Retain actual assessment and model exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ows-portability-assessment
          path: |
            modules/oa-runtime/target/conformance/
            modules/oa-runtime/target/surefire-reports/*OwsConformanceTest*
          if-no-files-found: error
