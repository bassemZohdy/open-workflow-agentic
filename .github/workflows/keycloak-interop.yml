name: keycloak-interop
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/keycloak-interop.yml'
      - 'tools/require_keycloak_evidence.py'
      - 'tools/test_keycloak_evidence.py'
      - 'modules/oa-runtime/src/**/identity/**'
      - 'apps/app-runtime/src/test/**/identity/**'
      - 'docs/adr/0021-*'
      - 'pom.xml'
      - 'apps/app-runtime/pom.xml'
      - 'modules/oa-runtime/pom.xml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/keycloak-interop.yml'
      - 'tools/require_keycloak_evidence.py'
      - 'modules/oa-runtime/src/**/identity/**'
      - 'apps/app-runtime/src/test/**/identity/**'
      - 'tools/test_keycloak_evidence.py'
      - 'docs/adr/0021-*'
      - 'pom.xml'
      - 'apps/app-runtime/pom.xml'
      - 'modules/oa-runtime/pom.xml'
permissions:
  contents: read
jobs:
  java-interop:
    name: keycloak-${{ matrix.profile }}-${{ matrix.evidence }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: standard
            image: quay.io/keycloak/keycloak:26.2.5
            test: KeycloakStandardIT
            evidence: contract
            evidence_args: ''
            delegation: 'false'
          - profile: delegation
            image: quay.io/keycloak/keycloak:26.8.1
            test: KeycloakDelegationIT
            evidence: contract
            evidence_args: ''
            delegation: 'true'
          - profile: standard
            image: quay.io/keycloak/keycloak:26.2.5
            test: KeycloakInteropIT
            evidence: characterization
            evidence_args: '--characterization'
            delegation: 'false'
          - profile: delegation
            image: quay.io/keycloak/keycloak:26.8.1
            test: KeycloakInteropIT
            evidence: characterization
            evidence_args: '--characterization'
            delegation: 'true'
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: agentic, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KEYCLOAK_URL: http://127.0.0.1:18080
      KEYCLOAK_PROFILE: ${{ matrix.profile }}
      KEYCLOAK_DELEGATION: ${{ matrix.delegation }}
      EVIDENCE_ARGS: ${{ matrix.evidence_args }}
      # Disposable CI-only credentials, never used against a deployment.
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-only
    steps:
      - uses: actions/checkout@v4
      - name: Require the real Java test before starting a server
        run: python3 tools/require_keycloak_evidence.py --profile "$KEYCLOAK_PROFILE" $EVIDENCE_ARGS --preflight
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Start an isolated pinned Keycloak server
        env:
          KC_IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          flags=()
          if [[ "$KEYCLOAK_PROFILE" == delegation ]]; then
            flags+=(--features=token-exchange-delegation,parameterized-scopes)
          fi
          docker run --detach --name keycloak-interop --publish 127.0.0.1:18080:8080 \
            --env KC_BOOTSTRAP_ADMIN_USERNAME="$KEYCLOAK_ADMIN_USER" \
            --env KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            "$KC_IMAGE" start-dev "${flags[@]}"
          for attempt in {1..90}; do
            if curl --fail --silent --max-time 2 "$KEYCLOAK_URL/realms/master/.well-known/openid-configuration" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs keycloak-interop
          exit 1
      - name: Run the product Java exchanger, verifier and resource guard
        env:
          JAVA_IT: ${{ matrix.test }}
        run: >-
          mvn -B -pl apps/app-runtime -am verify
          -Dit.test="$JAVA_IT" -Dfailsafe.failIfNoSpecifiedTests=false
          -Dkeycloak.required=true -Dkeycloak.profile="$KEYCLOAK_PROFILE"
          -Dkeycloak.url="$KEYCLOAK_URL"
      - name: Require passing non-skipped Java evidence
        run: python3 tools/require_keycloak_evidence.py --profile "$KEYCLOAK_PROFILE" $EVIDENCE_ARGS
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-${{ matrix.profile }}-${{ matrix.evidence }}-java-results
          path: apps/app-runtime/target/failsafe-reports/
          if-no-files-found: ignore
      - name: Stop the disposable server
        if: always()
        run: docker rm --force keycloak-interop || true
