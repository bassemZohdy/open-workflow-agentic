# --- Database (single Postgres for workflow state, agent checkpoints and scheduler) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/agentic}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=update

# --- Quarkus Flow: OWS workflow definitions are loaded from src/main/resources/flow ---
quarkus.flow.definitions.dir=flow

# --- Model access (Quarkus LangChain4j). Override for a real provider or gateway. ---
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:not-set}
quarkus.langchain4j.openai.base-url=${LLM_BASE_URL:https://api.openai.com/v1/}
quarkus.langchain4j.openai.chat-model.model-name=${LLM_MODEL:gpt-4o-mini}
quarkus.langchain4j.timeout=60s

# --- Agent defaults ---
agentic.agent.checkpoint-schema=public

# --- Caller identity (WP-102 replaces it). Headers X-Tenant and X-Subject are trusted only when this is true. ---
# Default false: every instance endpoint answers 401 until authentication exists. Never enable in a deployment.
agentic.dev.trust-caller-headers=false

# --- Schema + scheduler ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.db-scheduler.table-name=scheduled_tasks

# --- Audit trail (WP-111, M15) ---
# Development only: lets /audit answer without a bound policy decision point. Off by default, which answers 403.
agentic.dev.audit-open=${AUDIT_DEV_OPEN:false}
# Salt for redacted fields. Required when a rule redacts. Set it per deployment from a secret, never in the repository.
agentic.audit.redaction-salt=${AUDIT_REDACTION_SALT:}
# Verification of every chain, as a db-scheduler job (hourly, at 17 minutes past).
agentic.audit.verify-cron=0 17 * * * ?
